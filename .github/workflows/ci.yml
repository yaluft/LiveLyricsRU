name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Must pass on a fresh checkout with no prior build step — `tsc --build`
      # orders the project references itself, which is what v2's separate
      # per-workspace `tsc --noEmit` could not do.
      - run: npm run typecheck
      - run: npx tsc -p tsconfig.tests.json
      - run: npm run lint
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Runs against the upload fixture, so it needs neither yt-dlp nor network.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lyrika:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Boot the image and confirm it actually serves. A Dockerfile that builds
      # but produces a container that cannot start is the failure mode worth
      # catching, and it is invisible to `docker build` alone.
      - name: Smoke-test the image
        run: |
          docker run -d --name lyrika -p 8787:8787 lyrika:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8787/api/health > /tmp/health.json; then
              cat /tmp/health.json
              # The SPA must be served from the same origin as the API.
              curl -fsS -o /dev/null http://localhost:8787/
              docker rm -f lyrika
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"
          docker logs lyrika
          exit 1
