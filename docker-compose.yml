services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8787
      SERVE_CLIENT: "true"
      CORS_ORIGIN: "*"
      LOG_LEVEL: info
      # Pulled from a root .env via compose's own variable interpolation (not
      # env_file:, which would also drag in CLIENT_DIR/DATA_DIR — dev-relative
      # paths that don't resolve the same way inside this container's layout).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-}
      TRANSLATE_TARGET_LANG: ${TRANSLATE_TARGET_LANG:-}
    volumes:
      - lyrika-data:/app/.data
      - ./cookies.txt:/app/cookies.txt:ro
    expose:
      - "8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  lyrika-data:
