<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="description" content="Immersive music lyrics viewer with Russian pronunciation, translation, and 3D reactive backgrounds"/>
  <title>Лирика — Immersive Lyrics</title>
  <link rel="stylesheet" href="/src/style.css"/>
</head>
<body>
<canvas id="bg"></canvas>

<!-- ── Full-screen lyrics stage ── -->
<div id="lyrics-stage">
  <div id="lyrics-scroll">
    <div id="lyrics"></div>
  </div>
</div>

<!-- ── Settings modal (above everything) ── -->
<div id="options-panel">
  <div class="opt-section-title">Display</div>
  <label class="opt-row">
    <input type="checkbox" id="opt-pronunciation"/> Pronunciation
  </label>
  <label class="opt-row">
    <input type="checkbox" id="opt-translation"/> English translation
  </label>
  <div id="translate-status"></div>

  <div class="opt-sep"></div>
  <div class="opt-section-title">Theme</div>
  <div id="theme-btns">
    <button class="theme-btn active" data-theme="0">Nebula</button>
    <button class="theme-btn" data-theme="1">Lava</button>
    <button class="theme-btn" data-theme="2">Ocean</button>
    <button class="theme-btn" data-theme="3">Aurora</button>
    <button class="theme-btn" data-theme="4">Ember</button>
  </div>

  <div class="opt-sep"></div>
  <div class="opt-section-title">Background</div>
  <div id="bg-btns">
    <button class="bg-btn active" data-bg="planet">Planet</button>
    <button class="bg-btn" data-bg="cosmos">Cosmos</button>
    <button class="bg-btn" data-bg="storm">Storm</button>
    <button class="bg-btn" data-bg="neon">Neon</button>
    <button class="bg-btn" data-bg="fluid">Fluid</button>
  </div>
</div>

<!-- ── Dock ── -->
<div id="dock" class="dock-visible">

  <!-- Always-visible drag handle -->
  <div id="dock-handle">
    <div id="dock-handle-bar"></div>
  </div>

  <!-- Dock body -->
  <div id="dock-body">

    <!-- Song info row: album art + title + artist + action buttons -->
    <div id="dock-info">
      <img id="thumb" src="" alt="" style="display:none"/>
      <div id="track-text">
        <span id="track-title">Лирика</span>
        <span id="track-artist"></span>
      </div>
      <div id="dock-actions">
        <button id="opts-btn"    class="action-btn" title="Settings">⚙</button>
        <button id="related-btn" class="action-btn" title="Related">≡</button>
      </div>
    </div>

    <!-- Player controls (hidden until track loaded) -->
    <div id="player-section" class="hidden">
      <audio id="audio" crossorigin="anonymous" preload="auto"></audio>
      <div id="controls">
        <button id="play-btn" class="ctrl-btn">▶</button>
        <div id="progress-wrap">
          <div id="progress-bar"><div id="progress-fill"></div></div>
          <div id="time-display">
            <span id="cur-time">0:00</span>
            <span id="dur-time">–:––</span>
          </div>
        </div>
        <input id="vol-slider" type="range" min="0" max="1" step="0.01" value="0.8"/>
      </div>
      <div id="source-badge"></div>
    </div>

    <!-- Search -->
    <div id="dock-search">
      <div id="search-wrap">
        <div id="search-row">
          <input id="search-input" type="text"
            placeholder="Search or paste YouTube / VK / Spotify URL…"
            autocomplete="off" spellcheck="false"/>
          <button id="search-btn">Search</button>
        </div>
        <div id="dropdown" class="hidden"></div>
        <div id="history-row" class="hidden"></div>
      </div>
      <div id="status"></div>
    </div>

    <!-- Related panel -->
    <div id="related-panel" class="hidden">
      <div class="related-header">
        <span>Related songs</span>
        <button id="related-close" class="icon-btn">✕</button>
      </div>
      <div id="related-list"></div>
    </div>

  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
